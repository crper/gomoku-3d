name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling runs in-progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Official Vite+ action: installs vp, pins Node via `vp env use`,
      # caches dependencies by lockfile hash, and runs `vp install`.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Test
        run: vp run test

      - name: Build
        # GITHUB_ACTIONS is auto-set; vite.config.ts derives base from
        # GITHUB_REPOSITORY (/<repo>/) so assets resolve on GitHub Pages.
        run: vp run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
